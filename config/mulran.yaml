# Converted dataset root:
#   ${data_root}/mulran/${sequence}/manifest.yaml
data_root: /data/converted
dataset: mulran
sequence: KAIST01

play_rate: 1.0
loop: false
keyboard_control: true
start_paused: true

# 0-based LiDAR frame index range, using primary_lidar timestamps.
# end_lidar_frame: -1 means play until the last LiDAR frame.
primary_lidar: ouster
start_lidar_frame: 0
end_lidar_frame: -1

# Topic publish selection.
publish:
  ouster: true
  radar: false
  gps: false
  imu: true
  imu_mag: false

# Optional playback transform. Keep disabled for raw-frame SLAM playback.
transform:
  enabled: false

# Optional topics, frame_ids, /clock, and pose transform details:
#   docs/ros-playback.md
