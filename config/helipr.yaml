# Converted dataset root. The player looks for:
#   ${data_root}/helipr/${sequence}/manifest.yaml
data_root: /data/converted_datasets
dataset: helipr
sequence: DCC01

play_rate: 1.0
loop: false

# 0-based lidar frame index range, using primary_lidar timestamps.
# HeLiPR can use ouster, velodyne, livox_avia, or aeva as primary_lidar
# if that sensor exists in the converted sequence.
primary_lidar: ouster
start_lidar_frame: 0
end_lidar_frame: -1

publish:
  clock: true
  inspva: true
  imu: true
  imu_mag: false
  ouster: true
  velodyne: false
  livox_avia: false
  aeva: false

topics:
  inspva: /inspva
  imu: /imu/data_raw
  imu_mag: /imu/mag
  ouster: /ouster/points
  velodyne: /velodyne/points
  livox_avia: /avia/points
  aeva: /aeva/points

frame_ids:
  inspva: inspva
  imu: imu
  ouster: ouster
  velodyne: velodyne
  livox_avia: livox_avia
  aeva: aeva

# Optional playback transform.
# - pose_file: TUM format, one row per pose:
#     timestamp tx ty tz qx qy qz qw
#   timestamp may be seconds or nanoseconds.
# - static_matrix_file: text file with 16 numbers for a 4x4 matrix.
# - static_transform_order:
#     after_pose:  T_publish = T_static * T_pose
#     before_pose: T_publish = T_pose * T_static
transform:
  enabled: false
  pose_file: ""
  pose_format: tum
  pose_timestamp_tolerance_ns: 50000000
  static_matrix_file: ""
  static_transform_order: after_pose
  apply_to_pointcloud: true
  output_frame_id: map
  publish_pose: false
  pose_topic: /dataloader/pose
