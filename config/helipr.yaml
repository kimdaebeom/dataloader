# Converted dataset root:
#   ${data_root}/helipr/${sequence}/manifest.yaml
data_root: /data/converted_datasets
dataset: helipr
sequence: DCC01

play_rate: 1.0
loop: false
keyboard_control: true
start_paused: true

# 0-based LiDAR frame index range, using primary_lidar timestamps.
# HeLiPR can use ouster, velodyne, livox_avia, or aeva as primary_lidar
# if that sensor exists in the converted sequence.
primary_lidar: ouster
start_lidar_frame: 0
end_lidar_frame: -1

# Topic publish selection.
publish:
  inspva: true
  imu: true
  imu_mag: false
  ouster: true
  velodyne: false
  livox_avia: false
  aeva: false

# Optional playback transform. Keep disabled for raw-frame SLAM playback.
transform:
  enabled: false

# Optional topics, frame_ids, /clock, Livox, and pose transform details:
#   docs/ros-playback.md
