name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          setup_text = Path("setup.py").read_text(encoding="utf-8")
          version = re.search(r'version="([^"]+)"', setup_text).group(1)
          expected = "v{}".format(version)
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit("release tag {} must be {}".format(actual, expected))
          PY
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade build .
          python -m unittest discover -s tests -v
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autodataloader
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
