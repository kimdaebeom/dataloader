name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          setup_text = Path("setup.py").read_text(encoding="utf-8")
          version = re.search(r'version="([^"]+)"', setup_text).group(1)
          expected = "v{}".format(version)
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit("release tag {} must be {}".format(actual, expected))
          PY
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade build twine check-wheel-contents .
          python -m unittest discover -s tests -v
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          test ! -e "$(dirname "$(command -v dataloader-convert)")/dataloader-player"
      - name: Verify core source distribution
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = next(Path("dist").glob("*.tar.gz"))
          forbidden = (
              "CMakeLists.txt",
              "package.xml",
              "config/",
              "docs/",
              "launch/",
              "scripts/",
              "src/dataloader/player.py",
              "src/dataloader/ros_compat.py",
              "tests/",
          )
          with tarfile.open(archive) as handle:
              members = ["/".join(Path(name).parts[1:]) for name in handle.getnames()]
          included = [name for name in members if name in forbidden or name.startswith(forbidden)]
          if included:
              raise SystemExit("unexpected files in Python sdist: {}".format(included))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autodataloader
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
